services:
  db:
    image: postgres:16-alpine
    container_name: smart-scheduling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dc5a2d382046c85a8be0477772f40c1c
      POSTGRES_DB: smart_db
    ports:
      - "5432:5432"
    volumes:
      - smart_db_data:/var/lib/postgresql/data

volumes:
  smart_db_data:
